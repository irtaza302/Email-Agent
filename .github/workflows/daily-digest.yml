name: Daily Job Digest

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Create environment file
        run: |
          cat > .env << EOF
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          SUMMARY_RECIPIENT=${{ secrets.SUMMARY_RECIPIENT }}
          SUMMARY_SENDER=${{ secrets.SUMMARY_SENDER }}
          JOB_LABEL=${{ vars.JOB_LABEL || 'JobAlerts' }}
          SUMMARY_MODEL=${{ vars.SUMMARY_MODEL || 'x-ai/grok-4-fast:free' }}
          SUMMARY_MAX_EMAILS=${{ vars.SUMMARY_MAX_EMAILS || '20' }}
          SUMMARY_TIMEFRAME_HOURS=${{ vars.SUMMARY_TIMEFRAME_HOURS || '24' }}
          LOG_LEVEL=${{ vars.LOG_LEVEL || 'INFO' }}
          SUMMARY_TONE=${{ vars.SUMMARY_TONE || 'professional' }}
          SUMMARY_FORMAT=${{ vars.SUMMARY_FORMAT || 'markdown' }}
          SUMMARY_THEME_COLOR=${{ vars.SUMMARY_THEME_COLOR || '#2563eb' }}
          SUMMARY_BG_COLOR=${{ vars.SUMMARY_BG_COLOR || '#0f172a' }}
          SUMMARY_HEADER_TITLE=${{ vars.SUMMARY_HEADER_TITLE || 'Job Digest' }}
          SUMMARY_HEADER_SUBTITLE=${{ vars.SUMMARY_HEADER_SUBTITLE || '' }}
          EOF

      - name: Restore Google credentials
        env:
          GCP_CREDENTIALS_B64: ${{ secrets.GCP_CREDENTIALS_B64 }}
          GCP_TOKEN_B64: ${{ secrets.GCP_TOKEN_B64 }}
        run: |
          mkdir -p config
          echo "$GCP_CREDENTIALS_B64" | base64 -d > config/credentials.json
          echo "$GCP_TOKEN_B64" | base64 -d > config/token.json

      - name: Run daily digest
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m src.main

