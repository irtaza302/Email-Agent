name: Daily Job Digest

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore secrets
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_B64 }}
          GCP_CREDENTIALS_B64: ${{ secrets.GCP_CREDENTIALS_B64 }}
          GCP_TOKEN_B64: ${{ secrets.GCP_TOKEN_B64 }}
        run: |
          mkdir -p config
          echo "$ENV_FILE_B64" | base64 -d > .env
          echo "$GCP_CREDENTIALS_B64" | base64 -d > config/credentials.json
          echo "$GCP_TOKEN_B64" | base64 -d > config/token.json

      - name: Run daily digest
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m src.main

